name: Build and deploy blueprint

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build_blueprint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get install -y graphviz libgraphviz-dev pkg-config

      - name: Install Python deps
        run: pip install leanblueprint pygraphviz pymupdf

      - name: Install tectonic (TeX compiler for TikZ figures)
        run: |
          curl -sSL \
            https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar xz -C /usr/local/bin

      - name: Install custom TikZ imager for plasTeX
        run: python3 blueprint/install_imager.py

      - name: Build blueprint HTML
        run: leanblueprint web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blueprint/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_blueprint
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feat/blueprint'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
